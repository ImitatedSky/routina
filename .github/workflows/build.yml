name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 預設最小權限：目前只有編譯檢查，讀取原始碼就夠。
# 之後要加發佈 release 的 job 時，才在那個 job 內提升到 contents: write。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unsigned)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # 這個 action 預設會安裝已被 Google 下架的舊 'tools' 套件，
          # runner 的 cmdline-tools 升級後 sdkmanager 就找不到它而整步失敗。
          # 平台與 build-tools 由 Gradle 自行取得，這裡只留仍然存在的 platform-tools。
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 沒有 keystore secret 時 release 會 fallback 到 debug 簽章，
      # 足以驗證「編譯得起來、R8 規則沒問題」。
      - name: Build (debug-signed fallback verifies compile)
        run: ./gradlew :hub:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-unsigned-apk
          path: hub/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
